services:
  webserver:
    container_name: ${WEBSERVER_CONTAINER_NAME}
    build:
      context: .
      dockerfile: ./Dockerfile
    image: apldemo
    restart: unless-stopped
    volumes:
      - ./app:/app
    networks:
      - default

  php:
    container_name: ${PHP_CONTAINER_NAME}
    image: php:8.1-alpine
    restart: unless-stopped
    stdin_open: true
    tty: true
    command: /bin/sh
    volumes:
      - ./app:/app
    networks:
      - default
