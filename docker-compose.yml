version: "3.7"

services:
  apldemo:
    container_name: apldemo
    build:
      context: .
      dockerfile: ./Dockerfile
    image: apldemo
    volumes:
      - ./app:/app
    networks:
      - default

  apldemo_php:
    container_name: apldemo_composer
    image: php:7.4-cli
    volumes:
      - ./app:/app
    networks:
      - default
